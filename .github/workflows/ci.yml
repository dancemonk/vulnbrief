name: CI

on:
  pull_request:
  push:
    branches: [main]

# The job only reads the repository and runs checks, so the token is scoped
# down from the repository default rather than handed to third-party actions
# with write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: make lint

      - run: make format-check

      - run: make typecheck

      - run: make test
