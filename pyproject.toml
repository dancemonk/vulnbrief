[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnbrief"
version = "0.1.0"
description = "Terminal CVE briefing tool (NVD, CISA KEV, FIRST EPSS)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.12",
]

[project.scripts]
vulnbrief = "vulnbrief.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnbrief"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
